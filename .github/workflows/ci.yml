name: CI

on:
  # Docs-only pushes don't need a macOS build — and would cancel one that's
  # running, since runs on the same branch replace each other.
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS 27)
    # Flyby runs from macOS 15 but builds with the macOS 27 SDK, so it needs
    # Xcode 27 to build; the tests run on a macOS 27 host.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      # All history and tags: build.sh names dev builds after the latest
      # v-tag ("0.4.1-dev.3 · screenshot"), which a shallow clone doesn't have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The newest release Xcode on the image rather than whatever the
      # default is, and it has to have the macOS 27 SDK.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # Since 2026-09-28, xcrun on this image resolves the default SDK to
          # /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk, which isn't
          # installed — even with SDKROOT unset and Xcode selected — so every
          # xcrun and swift call failed. Name the selected Xcode's SDK
          # explicitly, here and in every later step.
          unset SDKROOT
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          SDK=$(xcrun --show-sdk-version)
          swift --version
          sw_vers
          [[ "${SDK%%.*}" -ge 27 ]] || { echo "::error::Flyby needs the macOS 27 SDK; $XCODE has $SDK"; exit 1; }
          OS=$(sw_vers -productVersion)
          [[ "${OS%%.*}" -ge 27 ]] || { echo "::error::the tests need a macOS 27 host; this runner is macOS $OS"; exit 1; }

      - name: Build (debug)
        run: swift build

      - name: Test
        if: hashFiles('Tests/**/*.swift') != ''
        run: swift test

      - name: Build dev app (Flyby Dev)
        run: ./build.sh

      # The release flavor, exactly as release.sh builds it — so a release
      # can't be the first time that configuration ever compiles.
      - name: Build release app (Flyby)
        run: FLAVOR=release VERSION="0.0.0-ci.${{ github.run_number }}" ./build.sh

      # FoundationModels only exists from macOS 26, so it has to be weak-linked
      # or Flyby won't launch on 15. The linker does that by itself as long
      # as every use is behind an availability check.
      - name: Check the release binary is Apple silicon, for macOS 15
        run: |
          BIN=build/Flyby.app/Contents/MacOS/Flyby
          test "$(lipo -archs "$BIN")" = arm64
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 15.0'
          otool -l "$BIN" | grep -B2 FoundationModels | grep -q LC_LOAD_WEAK_DYLIB

      # upload-artifact drops POSIX permissions, which leaves an app whose
      # executable won't run. ditto keeps them (and the signature) intact.
      - name: Zip apps
        run: |
          ditto -c -k --keepParent "build/Flyby Dev.app" "build/Flyby-Dev.zip"
          ditto -c -k --keepParent build/Flyby.app build/Flyby.zip

      - name: Upload dev app
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-Dev
          path: build/Flyby-Dev.zip
          if-no-files-found: error

      - name: Upload release app
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-release-ci
          path: build/Flyby.zip
          if-no-files-found: error
