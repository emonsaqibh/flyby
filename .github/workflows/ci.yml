name: CI

on:
  # Docs-only pushes don't need a macOS build — and would cancel one that's
  # running, since runs on the same branch replace each other.
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS 27)
    # Flyby targets macOS 27, so it needs Xcode 27 to build and a macOS 27
    # host to run its tests on.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The newest release Xcode on the image rather than whatever the
      # default is, and it has to have the macOS 27 SDK.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # The image has pointed SDKROOT at a Command Line Tools SDK that
          # isn't installed (since 2026-09-28), which fails every xcrun and
          # swift call. Use the selected Xcode's SDK, here and in later steps.
          echo "SDKROOT was '${SDKROOT:-}', DEVELOPER_DIR was '${DEVELOPER_DIR:-}'"
          unset SDKROOT
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          SDK=$(xcrun --show-sdk-version)
          swift --version
          sw_vers
          [[ "${SDK%%.*}" -ge 27 ]] || { echo "::error::Flyby needs the macOS 27 SDK; $XCODE has $SDK"; exit 1; }
          OS=$(sw_vers -productVersion)
          [[ "${OS%%.*}" -ge 27 ]] || { echo "::error::the tests need a macOS 27 host; this runner is macOS $OS"; exit 1; }

      - name: Build (debug)
        run: swift build

      - name: Test
        if: hashFiles('Tests/**/*.swift') != ''
        run: swift test

      - name: Build dev app (Flyby Dev)
        run: ./build.sh

      # The release flavor, exactly as release.sh builds it — so a release
      # can't be the first time that configuration ever compiles.
      - name: Build release app (Flyby)
        run: FLAVOR=release VERSION="0.0.0-ci.${{ github.run_number }}" ./build.sh

      - name: Check the release binary is Apple silicon, for macOS 27
        run: |
          test "$(lipo -archs build/Flyby.app/Contents/MacOS/Flyby)" = arm64
          otool -l build/Flyby.app/Contents/MacOS/Flyby | grep -A4 LC_BUILD_VERSION | grep -q 'minos 27'

      # upload-artifact drops POSIX permissions, which leaves an app whose
      # executable won't run. ditto keeps them (and the signature) intact.
      - name: Zip apps
        run: |
          ditto -c -k --keepParent "build/Flyby Dev.app" "build/Flyby-Dev.zip"
          ditto -c -k --keepParent build/Flyby.app build/Flyby.zip

      - name: Upload dev app
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-Dev
          path: build/Flyby-Dev.zip
          if-no-files-found: error

      - name: Upload release app
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-release-ci
          path: build/Flyby.zip
          if-no-files-found: error
