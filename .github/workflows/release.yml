name: Release

# Releases are made on a Mac, with ./release.sh and ./publish.sh: from 0.5.2
# they're signed with the "Flyby Release Signing" certificate, which keeps
# people's Screen Recording, Accessibility and Input Monitoring grants from one
# update to the next — and that certificate lives only on the Mac releases are
# made on. A build here would be ad-hoc: a new app to macOS, and everyone's
# grants gone again. So this workflow:
#
#   - on the tag publish.sh pushes, sees the release is already there and
#     stops, successfully;
#   - on any other tag, or Actions › Release › Run workflow, refuses and says
#     where releases are made.
#
# The steps after the guard are what it used to do — test, build the release
# flavor, zip it, create the GitHub release (a pre-release for x.y.z-suffix
# tags, Latest for plain x.y.z, notes from docs/releases/<version>.md) — kept
# for when the certificate is given to it as a secret.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0-beta.1 or 0.3.0 (tagged v<version> on the selected branch)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    # macOS 27 and Xcode 27, same as CI: the tests only run on macOS 27.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="${INPUT_VERSION#v}"
            if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::v$VERSION already exists — versions are never reused"
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$VERSION' isn't a version (X.Y.Z or X.Y.Z-beta.N)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "kind=--prerelease" >> "$GITHUB_OUTPUT"; else echo "kind=--latest" >> "$GITHUB_OUTPUT"; fi

      - name: Made on a Mac?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published (publish.sh made it) — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Flyby releases are made on a Mac with ./release.sh and ./publish.sh: they're signed with the \"Flyby Release Signing\" certificate, so people keep their permissions across updates, and that certificate isn't here. A build here would be ad-hoc, and everyone would grant Flyby's permissions again."
          exit 1

      - name: Select Xcode
        if: steps.guard.outputs.skip != 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # xcrun on this image resolves the default SDK to a Command Line
          # Tools SDK that isn't installed (see ci.yml); name Xcode's.
          unset SDKROOT
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          SDK=$(xcrun --show-sdk-version); OS=$(sw_vers -productVersion)
          [[ "${SDK%%.*}" -ge 27 && "${OS%%.*}" -ge 27 ]] || { echo "::error::needs Xcode 27 on macOS 27 (SDK $SDK, macOS $OS)"; exit 1; }

      - name: Test
        if: steps.guard.outputs.skip != 'true'
        run: swift test

      - name: Build Flyby ${{ steps.version.outputs.version }}
        if: steps.guard.outputs.skip != 'true'
        run: FLAVOR=release VERSION="${{ steps.version.outputs.version }}" ./build.sh

      - name: Check the build
        if: steps.guard.outputs.skip != 'true'
        run: |
          test "$(lipo -archs build/Flyby.app/Contents/MacOS/Flyby)" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/Flyby.app/Contents/Info.plist)" = com.fringecore.flyby
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Flyby.app/Contents/Info.plist)" = "${{ steps.version.outputs.version }}"
          codesign --verify --strict build/Flyby.app

      - name: Package
        if: steps.guard.outputs.skip != 'true'
        run: ditto -c -k --keepParent build/Flyby.app build/Flyby.zip

      - name: Publish the GitHub release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="docs/releases/$VERSION.md"
          if [[ -f "$NOTES" ]]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          TAG="${{ steps.version.outputs.tag }}"
          # A pushed tag already exists; a manual run creates it on this commit.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then TAG_ARGS=(--target "$GITHUB_SHA"); else TAG_ARGS=(--verify-tag); fi
          gh release create "$TAG" build/Flyby.zip "${TAG_ARGS[@]}" \
            ${{ steps.version.outputs.kind }} --title "Flyby $VERSION" "${NOTE_ARGS[@]}"

          # install.sh and the in-app updater both need the zip; make sure it's there.
          for _ in $(seq 1 12); do
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx Flyby.zip && exit 0
            sleep 5
          done
          echo "::error::Flyby.zip isn't attached to $TAG"
          exit 1
